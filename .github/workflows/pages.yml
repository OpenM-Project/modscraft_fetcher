name: Deploy static site

on:
  push:
    branches: ["main"]
  schedule:
    - cron: '0 0 */3 * *'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Record build timestamp
        run: echo "BUILD_TIME=$(date -u '+%Y-%m-%d %H:%M:%S')" >> $GITHUB_ENV

      - name: Install dependencies
        run: python3 -m pip install -r requirements.txt

      - name: Run parser
        run: python3 modscraft_mcpe_parser.py _site/index.html
        env:
          BUILD_TIME: ${{ env.BUILD_TIME }}
      
      - name: Cache-bust CSS and JS assets
        run: |
          BUILD_ID=$(date +%s)
          sed -i "s/\.css/.css?v=${BUILD_ID}/g" _site/index.html
          sed -i "s/\.js/.js?v=${BUILD_ID}/g" _site/index.html

      - name: Inspect generated site
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          p = Path('_site/index.html')
          print('INDEX EXISTS', p.exists())
          if p.exists():
              text = p.read_text()
              m = re.search(r'Last update: <code>(.*?) UTC</code>', text)
              print('LAST UPDATE:', m.group(1) if m else 'NONE')
              print('PAGE SIZE:', len(text))
          print('SITE FILES:')
          for path in sorted(Path('_site').rglob('*')):
              print(path)
          PY

      - name: Upload static site artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  publish:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
