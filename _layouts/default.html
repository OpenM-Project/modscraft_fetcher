<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>{{ page.title | default: site.title }}</title>
    <style>
      :root {
        color-scheme: light;
        --bg: #f8fafc;
        --surface: #ffffff;
        --text: #111827;
        --muted: #6b7280;
        --border: #d1d5db;
        --accent: #2563eb;
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        font-family: Inter, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        background: var(--bg);
        color: var(--text);
        line-height: 1.6;
      }
      .page-container {
        max-width: 980px;
        margin: 0 auto;
        padding: 1.5rem 1.25rem 3rem;
      }
      header {
        margin-bottom: 2rem;
      }
      h1, h2, h3 {
        color: #111827;
      }
      a {
        color: var(--accent);
        text-decoration: none;
      }
      a:hover {
        text-decoration: underline;
      }
      .site-meta {
        color: var(--muted);
        margin-bottom: 1.25rem;
      }
      .content > *:first-child {
        margin-top: 0;
      }
      table {
        width: 100%;
        border-collapse: collapse;
        margin: 1rem 0;
      }
      th, td {
        border: 1px solid var(--border);
        padding: 0.75rem 0.85rem;
      }
      th {
        background: #f3f4f6;
        text-align: left;
      }
      tbody tr:nth-child(even) {
        background: #f8fafc;
      }
      .footer {
        margin-top: 3rem;
        padding-top: 1rem;
        border-top: 1px solid var(--border);
        color: var(--muted);
        font-size: 0.95rem;
      }
    </style>
  </head>
  <body>
    <div class="page-container">
      <header>
        <p class="site-meta">{{ site.title }} • Minecraft APK archive</p>
        <h1>{{ page.title | default: site.title }}</h1>
      </header>
      <main class="content">
        {{ content }}
      </main>
      <footer class="footer">
        <p>Built with Jekyll.</p>
      </footer>
    </div>
  </body>
</html>
